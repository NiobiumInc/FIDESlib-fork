# Builds FIDESlib with CUDA and runs its GPU test suite on a cloud GPU runner
# from the gcp-ephemeral pool: one VM per job, deleted afterwards, with no route
# to the internal network. .github/gpu-tests/ lists the tests the check leaves
# out and why; any other test that fails all three attempts fails the check.
# The job summary reports what failed, including the flaky tests, which run as
# a report only.

name: GPU tests

on:
  pull_request:
    branches: [nb_main]
    # ready_for_review: draft pull requests skip this check until then.
    types: [opened, synchronize, reopened, ready_for_review]
  # A merge into nb_main. Merging does not require the branch to be up to date,
  # so a pull request's check may have run against an older nb_main; this run
  # tests the tree the merge left there.
  push:
    branches: [nb_main]
  workflow_dispatch:
    inputs:
      known_failures:
        description: Also run the known failures, as a report that never fails the check
        type: boolean
        default: false
  # The release workflow runs the whole suite on the commit it is about to release.
  workflow_call:
    inputs:
      known_failures:
        description: Also run the known failures, as a report that never fails the check
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Each push to nb_main gets its own run. Cancelling one for the next would
  # leave a merge that changed code untested when the next merge changes none.
  # In a run called from the release workflow, github.workflow names the caller: the gpu-
  # prefix keeps that run out of the release's own concurrency group.
  group: gpu-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  # Patched OpenFHE, installed by deps/build.sh when CMake runs with
  # FIDESLIB_INSTALL_OPENFHE=ON, and cached per OS and compiler.
  OPENFHE_DIR: ${{ github.workspace }}/.ci/openfhe

jobs:
  gpu:
    name: GPU test suite (RTX PRO 6000)
    runs-on: [self-hosted, Linux, X64, gcp-ephemeral, g4-standard-48, "run-${{ github.run_id }}"]
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain and GPU
        id: env
        run: |
          nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv,noheader
          nvcc --version | tail -2
          gcc --version | head -1
          cmake --version | head -1
          . /etc/os-release
          {
            echo "cuda=$(nvcc --version | sed -nE 's/.*release ([0-9]+\.[0-9]+).*/\1/p')"
            echo "cuda_path=$(dirname "$(dirname "$(readlink -f "$(command -v nvcc)")")")"
            echo "distro=ubuntu${VERSION_ID//./}"
            echo "toolchain=${ID}${VERSION_ID}-gcc$(gcc -dumpversion)"
          } >> "$GITHUB_OUTPUT"

      # The GPU test suite includes nccl.h. Install the NCCL build for the
      # runner's CUDA version from NVIDIA's apt repository, after checking the
      # keyring package's hash. The keyring goes through apt-get, not dpkg -i,
      # because dpkg does not wait for a lock another process holds.
      - name: Install NCCL
        env:
          CUDA_VERSION: ${{ steps.env.outputs.cuda }}
          DISTRO: ${{ steps.env.outputs.distro }}
        run: |
          case "$DISTRO" in
            ubuntu2404) sum=d2a6b11c096396d868758b86dab1823b25e14d70333f1dfa74da5ddaf6a06dba ;;
            ubuntu2204) sum=d93190d50b98ad4699ff40f4f7af50f16a76dac3bb8da1eaaf366d47898ff8df ;;
            *) echo "::error::no known hash for NVIDIA's keyring package on $DISTRO"; exit 1 ;;
          esac
          curl -fsSLo cuda-keyring.deb \
            "https://developer.download.nvidia.com/compute/cuda/repos/$DISTRO/x86_64/cuda-keyring_1.1-1_all.deb"
          echo "$sum  cuda-keyring.deb" | sha256sum -c -
          # A fresh VM can still be running apt on its own (unattended upgrades,
          # first-boot setup). Wait, up to 10 minutes, while a process holds apt's
          # or dpkg's lock files open; apt itself also waits as long for dpkg's
          # lock. This checks the locks, not process names: the unattended-upgrades
          # shutdown daemon runs all the time under the same name without a lock.
          command -v fuser > /dev/null || echo "::warning::fuser not found: not waiting for apt's and dpkg's locks"
          waited=0
          while [ "$waited" -lt 600 ] &&
            sudo fuser /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock > /dev/null 2>&1; do
            sleep 5
            waited=$((waited + 5))
          done
          echo "Waited ${waited}s for apt's and dpkg's locks."
          apt=(sudo apt-get -o DPkg::Lock::Timeout=600)
          "${apt[@]}" install -y ./cuda-keyring.deb
          "${apt[@]}" update
          suffix="+cuda$CUDA_VERSION"
          ver=$(apt-cache madison libnccl-dev |
                awk -v s="$suffix" 'substr($3, length($3) - length(s) + 1) == s { print $3; exit }')
          if [ -z "$ver" ]; then
            echo "::error::NVIDIA's repository has no NCCL build for CUDA $CUDA_VERSION"
            exit 1
          fi
          "${apt[@]}" install -y --no-install-recommends "libnccl2=$ver" "libnccl-dev=$ver"

      - name: Restore OpenFHE
        id: openfhe
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci/openfhe
          key: openfhe-${{ steps.env.outputs.toolchain }}-${{ hashFiles('deps/build.sh', 'deps/*.patch') }}

      # FIDESlib resolves ../deps relative to the directory CMake runs in, so
      # configure from build/.
      - name: Configure
        env:
          CUDA_PATH: ${{ steps.env.outputs.cuda_path }}
        run: |
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCUDA_PATH="$CUDA_PATH" \
            -DFIDESLIB_ARCH=120-real \
            -DFIDESLIB_COMPILE_BENCHMARKS=OFF \
            -DFIDESLIB_INSTALL_OPENFHE=${{ steps.openfhe.outputs.cache-hit == 'true' && 'OFF' || 'ON' }} \
            -DOPENFHE_INSTALL_PREFIX="$OPENFHE_DIR"

      # Saved before the build and tests, so a failing test does not throw away
      # a finished OpenFHE build.
      - name: Save OpenFHE
        if: steps.openfhe.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci/openfhe
          key: openfhe-${{ steps.env.outputs.toolchain }}-${{ hashFiles('deps/build.sh', 'deps/*.patch') }}

      - name: Build
        id: build
        run: cmake --build build -j "$(nproc)" --target fideslib-test

      # PROBE (not for merge): which of upstream's operations read a plaintext or a key without waiting
      # for its stream. Each suite runs in its own process, so one crash does not hide the rest.
      - name: Amplified suites on upstream, pooled streams, no fence fix
        working-directory: build
        env:
          FIDESLIB_TEST_BACKEND: cuda
          FIDESLIB_PROBE_POOLED_PT: '1'
          FIDESLIB_PROBE_UPLOAD_DELAY_US: '30'
        run: |
          bash ../probe-run-suites.sh u1
      - name: Amplified suites on upstream, pooled streams, with the multPt fence
        if: ${{ !cancelled() }}
        working-directory: build
        env:
          FIDESLIB_TEST_BACKEND: cuda
          FIDESLIB_PROBE_POOLED_PT: '1'
          FIDESLIB_PROBE_MULTPT_FENCE: '1'
          FIDESLIB_PROBE_UPLOAD_DELAY_US: '30'
        run: |
          bash ../probe-run-suites.sh u2
      - name: Control, upload delay on the legacy stream
        if: ${{ !cancelled() }}
        working-directory: build
        env:
          FIDESLIB_TEST_BACKEND: cuda
          FIDESLIB_PROBE_UPLOAD_DELAY_US: '30'
        run: |
          bash ../probe-run-suites.sh u0

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: probe-upstream
          path: build/probe-*
          retention-days: 14
          if-no-files-found: ignore
