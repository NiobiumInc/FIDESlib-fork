# Builds FIDESlib and runs the tests that need no GPU, on GitHub-hosted runners.
# Every pull request gets these checks, forks included: each runner is discarded
# after its job, and the token can only read the repository.

name: CI

on:
  pull_request:
    branches: [nb_main]
    # ready_for_review: a stacked draft retargeted to nb_main gets its checks
    # when it is marked ready, as the GPU workflow does.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [nb_main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Patched OpenFHE, installed by deps/build.sh when CMake runs with
  # FIDESLIB_INSTALL_OPENFHE=ON. build.sh pins the OpenFHE tag and the patch,
  # so those files key the cache. Both jobs build it with the runner's gcc.
  OPENFHE_DIR: ${{ github.workspace }}/.ci/openfhe

jobs:
  # Lists the pull request's changed files and decides whether the test jobs
  # need to run (.github/scripts/needs_tests.py). Only an explicit "false"
  # skips them: if this job fails, they run anyway.
  changes:
    name: Decide what to test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github

      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "**Tests run:** $EVENT event, not a pull request." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh api --paginate "repos/$REPO/pulls/$PR/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' > changed.txt
          python3 .github/scripts/needs_tests.py changed.txt .github/no-test-paths.txt \
            --always .github/workflows/ci.yml .github/scripts/needs_tests.py .github/no-test-paths.txt \
              .github/scripts/build-examples.sh .github/examples-skip.txt

  cpu:
    name: CPU build and tests
    needs: changes
    # Runs unless the decision is an explicit "false"; a failed decision runs it.
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain versions
        run: |
          gcc --version | head -1
          cmake --version | head -1

      # A tree without the FIDESLIB_ENABLE_CUDA option has no CPU-only build.
      # The job then says so in a notice and runs nothing else.
      - name: Look for the CPU-only build
        id: cpu-build
        run: |
          if grep -q 'option(FIDESLIB_ENABLE_CUDA' CMakeLists.txt; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No CPU-only build in this tree (no FIDESLIB_ENABLE_CUDA option): nothing to test."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore OpenFHE
        id: openfhe
        if: steps.cpu-build.outputs.present == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci/openfhe
          key: openfhe-ubuntu-24.04-${{ hashFiles('deps/build.sh', 'deps/*.patch') }}

      # FIDESlib resolves ../deps relative to the directory CMake runs in, so
      # configure from build/.
      - name: Configure
        if: steps.cpu-build.outputs.present == 'true'
        run: |
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DFIDESLIB_ENABLE_CUDA=OFF \
            -DFIDESLIB_COMPILE_BENCHMARKS=OFF \
            -DFIDESLIB_INSTALL_OPENFHE=${{ steps.openfhe.outputs.cache-hit == 'true' && 'OFF' || 'ON' }} \
            -DOPENFHE_INSTALL_PREFIX="$OPENFHE_DIR"

      # Saved here, before the build and tests, so a failing test does not
      # throw away a finished OpenFHE build.
      - name: Save OpenFHE
        if: steps.cpu-build.outputs.present == 'true' && steps.openfhe.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci/openfhe
          key: openfhe-ubuntu-24.04-${{ hashFiles('deps/build.sh', 'deps/*.patch') }}

      - name: Build
        if: steps.cpu-build.outputs.present == 'true'
        run: cmake --build build -j "$(nproc)" --target fideslib-cpu-test

      - name: Test
        if: steps.cpu-build.outputs.present == 'true'
        working-directory: build
        run: ./fideslib-cpu-test

  # The CPU and haze backends, built the way the release builds them (packaging/
  # build-release.sh, in the release's manylinux_2_28 container: gcc-toolset-14,
  # OpenFHE patched and with reduced noise, haze's own instrumented OpenFHE) and run
  # over the whole suite. release.yml calls this workflow, so a failure here also
  # stops a release. haze is an in-process simulator, so no hardware is needed.
  #
  # The haze suite is long (about 100 minutes on one hosted runner), so it is split
  # into shards with gtest's own GTEST_TOTAL_SHARDS / GTEST_SHARD_INDEX: each test
  # runs in exactly one shard, and the check fails if any shard fails. The cpu leg
  # runs the whole suite in one shard.
  haze:
    name: ${{ matrix.backend }} tests, release build (${{ matrix.shard }}/${{ matrix.shards }})
    needs: changes
    # Runs unless the decision is an explicit "false"; a failed decision runs it.
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: ubuntu-24.04
    container: quay.io/pypa/manylinux_2_28_x86_64
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - { backend: cpu, shard: 0, shards: 1 }
          - { backend: haze, shard: 0, shards: 4 }
          - { backend: haze, shard: 1, shards: 4 }
          - { backend: haze, shard: 2, shards: 4 }
          - { backend: haze, shard: 3, shards: 4 }
    env:
      BUILD_ROOT: ${{ github.workspace }}/.ci/release-build
      GT_ROOT: /opt/rh/gcc-toolset-14/root
    steps:
      # niobium-haze and its nested niobium-fhetch are public repos, so the default
      # GITHUB_TOKEN clones them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      # The three dependency builds (OpenFHE, haze's OpenFHE, libhaze) depend only on
      # the pinned sources, the patch and the build script, so those key the cache.
      - name: Key the dependency cache
        id: key
        run: |
          src=$(git submodule status --recursive | sed 's/^[ +-]//' | awk '{print $1, $2}' | sha256sum | cut -c1-16)
          echo "deps=release-deps-manylinux-$src-${{ hashFiles('deps/build.sh', 'deps/*.patch', 'packaging/build-release.sh') }}" >> "$GITHUB_OUTPUT"

      - name: Restore the dependency builds
        id: deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .ci/release-build/openfhe-install
            .ci/release-build/haze-openfhe-install
            .ci/release-build/haze
          key: ${{ steps.key.outputs.deps }}

      - name: Build the test binary
        run: |
          JOBS="$(nproc)" \
          OUT_DIR="$RUNNER_TEMP/dist" \
          TEST_BUILD=1 \
          DEPS_CACHED="${{ steps.deps.outputs.cache-hit == 'true' && '1' || '0' }}" \
            bash packaging/build-release.sh

      # One leg saves, so the legs that all missed at once do not race to write the
      # same key. Saved after a successful build, so only a working set is stored.
      - name: Save the dependency builds
        if: steps.deps.outputs.cache-hit != 'true' && matrix.backend == 'haze' && matrix.shard == 0
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .ci/release-build/openfhe-install
            .ci/release-build/haze-openfhe-install
            .ci/release-build/haze
          key: ${{ steps.key.outputs.deps }}

      # haze writes each program's trace under /tmp by default (several GB over a full
      # run), so point it at the workspace disk.
      - name: Test
        working-directory: .ci/release-build/fideslib-test
        env:
          FIDESLIB_TEST_BACKEND: ${{ matrix.backend }}
          FIDESLIB_HAZE_RUNS_DIR: ${{ runner.temp }}/haze-runs
          GTEST_TOTAL_SHARDS: ${{ matrix.shards }}
          GTEST_SHARD_INDEX: ${{ matrix.shard }}
        run: |
          source /opt/rh/gcc-toolset-14/enable
          mkdir -p "$FIDESLIB_HAZE_RUNS_DIR"
          ./fideslib-cpu-test --gtest_output="xml:$RUNNER_TEMP/results.xml"

      - name: Report
        if: always()
        run: |
          {
            echo "### ${{ matrix.backend }} tests, shard ${{ matrix.shard }} of ${{ matrix.shards }}"
            if [ -f "$RUNNER_TEMP/results.xml" ]; then
              head -2 "$RUNNER_TEMP/results.xml" | grep -o '<testsuites [^>]*' | grep -oE '(tests|failures|disabled|errors)="[0-9]+"' | tr '\n' ' '
              echo
            else
              echo "No result file: the binary did not finish."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ${{ matrix.backend }}-test-results-${{ matrix.shard }}
          path: ${{ runner.temp }}/results.xml
          if-no-files-found: ignore

  cuda-compile:
    name: CUDA compile (sm_120, no GPU)
    needs: changes
    # Runs unless the decision is an explicit "false"; a failed decision runs it.
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CUDA_PATH: /usr/local/cuda-13.2
      FIDESLIB_PREFIX: ${{ github.workspace }}/.ci/fideslib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only the CUDA components FIDESlib compiles and links against: nvcc, the
      # runtime and driver API headers and stubs, libcu++ (cuda/atomic,
      # cuda/barrier, cuda/pipeline), and NCCL, whose header the GPU test suite
      # includes. NCCL is pinned to its CUDA 13.2 build; the unpinned package
      # follows the newest CUDA. The keyring package is checked against its
      # known hash before apt trusts NVIDIA's repository, and goes through
      # apt-get, not dpkg -i, because dpkg does not wait for a lock another
      # process holds.
      - name: Install CUDA 13.2
        run: |
          curl -fsSLo cuda-keyring.deb \
            https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          echo "d2a6b11c096396d868758b86dab1823b25e14d70333f1dfa74da5ddaf6a06dba  cuda-keyring.deb" | sha256sum -c -
          # A fresh VM can still be running apt on its own (unattended upgrades,
          # first-boot setup). Wait, up to 10 minutes, while a process holds apt's
          # or dpkg's lock files open; apt itself also waits as long for dpkg's
          # lock. This checks the locks, not process names: the unattended-upgrades
          # shutdown daemon runs all the time under the same name without a lock.
          command -v fuser > /dev/null || echo "::warning::fuser not found: not waiting for apt's and dpkg's locks"
          waited=0
          while [ "$waited" -lt 600 ] &&
            sudo fuser /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock > /dev/null 2>&1; do
            sleep 5
            waited=$((waited + 5))
          done
          echo "Waited ${waited}s for apt's and dpkg's locks."
          apt=(sudo apt-get -o DPkg::Lock::Timeout=600)
          "${apt[@]}" install -y ./cuda-keyring.deb
          "${apt[@]}" update
          "${apt[@]}" install -y --no-install-recommends \
            cuda-nvcc-13-2 cuda-cudart-dev-13-2 cuda-driver-dev-13-2 cuda-cccl-13-2 \
            libnccl2=2.30.4-1+cuda13.2 libnccl-dev=2.30.4-1+cuda13.2
          "$CUDA_PATH/bin/nvcc" --version | tail -2
          gcc --version | head -1
          cmake --version | head -1

      - name: Restore OpenFHE
        id: openfhe
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci/openfhe
          key: openfhe-ubuntu-24.04-${{ hashFiles('deps/build.sh', 'deps/*.patch') }}

      - name: Configure
        run: |
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCUDA_PATH="$CUDA_PATH" \
            -DFIDESLIB_ARCH=120-real \
            -DFIDESLIB_COMPILE_BENCHMARKS=OFF \
            -DFIDESLIB_INSTALL_OPENFHE=${{ steps.openfhe.outputs.cache-hit == 'true' && 'OFF' || 'ON' }} \
            -DOPENFHE_INSTALL_PREFIX="$OPENFHE_DIR" \
            -DFIDESLIB_INSTALL_PREFIX="$FIDESLIB_PREFIX"

      - name: Save OpenFHE
        if: steps.openfhe.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci/openfhe
          key: openfhe-ubuntu-24.04-${{ hashFiles('deps/build.sh', 'deps/*.patch') }}

      # Compiles and links the library and the GPU test suite. Running the
      # suite needs a GPU, so it runs on a GPU runner instead.
      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Install
        run: cmake --install build

      # Each example is a standalone project that finds the installed package,
      # as a user's application would.
      - name: Build the examples against the installed package
        run: |
          .github/scripts/build-examples.sh "$FIDESLIB_PREFIX" build-examples \
            -DCUDAToolkit_ROOT="$CUDA_PATH" \
            -DCMAKE_CUDA_COMPILER="$CUDA_PATH/bin/nvcc" \
            -DCMAKE_CUDA_ARCHITECTURES=120-real
